<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3a9c">
<title>Імітація Windows 11 — варіант 1 (ноутбук Максима)</title>
<style>
:root{
  --tbh:calc(48px + env(safe-area-inset-bottom,0px));
  --accent:#0067c0;--bg:#f3f3f3;--card:#fff;--line:#e3e3e3;--txt:#1a1a1a;--sub:#5f5f5f;--sel:#cce4f7;
  font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b3a9c;color:var(--txt);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-size:14px}
body{height:100dvh}
button{font:inherit;color:inherit}
.i{display:inline-flex;width:var(--s,20px);height:var(--s,20px);flex:none}
.i svg{width:100%;height:100%}
.i.chrome{border-radius:50%;background:conic-gradient(from -30deg,#ea4335 0 120deg,#fbbc05 120deg 240deg,#34a853 240deg 360deg);position:relative}
.i.chrome::before{content:"";position:absolute;inset:27%;border-radius:50%;background:#fff}
.i.chrome::after{content:"";position:absolute;inset:34%;border-radius:50%;background:#4285f4}
.g{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- робочий стіл ---------- */
#desktop{position:fixed;inset:0 0 var(--tbh) 0;overflow:hidden;
  background:
    radial-gradient(ellipse 55% 42% at 28% 58%,rgba(40,120,240,.95) 0,rgba(40,120,240,0) 70%),
    radial-gradient(ellipse 48% 38% at 68% 36%,rgba(140,200,255,.95) 0,rgba(140,200,255,0) 70%),
    radial-gradient(ellipse 42% 55% at 46% 78%,rgba(8,50,160,.95) 0,rgba(8,50,160,0) 75%),
    radial-gradient(ellipse 30% 25% at 82% 80%,rgba(90,60,200,.55) 0,rgba(90,60,200,0) 70%),
    linear-gradient(160deg,#cfe0fa,#86aeea 45%,#2b5fc0)}
#icons{position:absolute;inset:0;padding:8px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,94px);grid-auto-columns:86px;align-content:start;justify-content:start}
.dicon{width:82px;height:90px;padding:6px 3px;border:1px solid transparent;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;text-align:center;font-size:12px;line-height:1.2;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.dicon.sel{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45)}
.dicon span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
#windows{position:absolute;inset:0;pointer-events:none}

/* ---------- вікна ---------- */
.win{position:absolute;pointer-events:auto;background:var(--bg);border:1px solid rgba(0,0,0,.28);border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
.win.min{display:none}
.titlebar{height:36px;display:flex;align-items:center;background:#e9eef6;flex:none;padding-left:10px;gap:8px;font-size:12px}
.win.active .titlebar{background:#dce7f7}
.ttitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;height:100%}
.tbtns button{width:46px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.tbtns button:active{background:rgba(0,0,0,.1)}
.tbtns button.close:active{background:#c42b1c;color:#fff}
.wbody{flex:1;min-height:0;display:flex;background:var(--bg)}
.cq{container-type:inline-size;width:100%;height:100%;min-width:0}
@media (max-width:759px){
  .win{inset:0!important;width:auto!important;height:auto!important;border-radius:0}
  .tbtns .maxb{display:none}
  .tbtns button{width:52px}
}

/* ---------- панель завдань ---------- */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--tbh);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5000;
  background:rgba(243,243,243,.88);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border-top:1px solid rgba(0,0,0,.1);
  display:flex;align-items:center}
#tbicons{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px;max-width:calc(100% - 190px);overflow:hidden}
.tbb{width:44px;height:42px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;position:relative;padding:0}
.tbb:active,.tbb.hot{background:rgba(0,0,0,.07)}
.tbb.open::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#767676}
.tbb.open.act::after{width:16px;margin-left:-8px;background:var(--accent)}
#tray{position:absolute;right:6px;display:flex;align-items:center;gap:8px;font-size:12px;color:#222}
#tray .hb{width:26px;height:26px;border-radius:50%;border:1px solid #8aa;background:#fff;color:var(--accent);font-weight:700;font-size:14px;padding:0}
#tray .clk{text-align:right;line-height:1.25}
#tray .lang{font-size:12px}
@media (max-width:700px){
  #tbicons{left:6px;transform:none;max-width:calc(100% - 140px)}
  #tray .lang,#tray .vol,#tray .dt{display:none}
}

/* ---------- меню ---------- */
.menu,.panel{position:fixed;z-index:5500;background:rgba(250,250,250,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #cfcfcf;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.menu[hidden],.panel[hidden]{display:none}
.menu{padding:4px;min-width:230px;max-height:calc(100dvh - var(--tbh) - 12px);overflow:auto}
.mi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:5px;white-space:nowrap;font-size:14px}
.mi:active{background:#e3ecf7}
.mi .arr{margin-left:auto}
.msep{height:1px;background:#dcdcdc;margin:3px 6px}
#winx{left:8px;bottom:calc(var(--tbh) + 6px)}
#ctx{z-index:6500;min-width:160px}
.panel{left:50%;transform:translateX(-50%);bottom:calc(var(--tbh) + 8px);width:min(560px,calc(100vw - 16px));padding:18px;max-height:calc(100dvh - var(--tbh) - 20px);overflow:auto}
.panel .srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #d5d5d5;border-radius:18px;padding:8px 14px;color:#777;margin-bottom:14px}
.panel h4{margin:0 0 8px;font-size:13px;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.pit{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:6px;font-size:12px;text-align:center}
.pit:active{background:#e3ecf7}
.pfoot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ddd;padding-top:10px;margin-top:6px;font-size:13px}

#batfly{left:auto;transform:none;right:8px;bottom:calc(var(--tbh) + 6px);width:min(320px,calc(100vw - 16px));padding:14px}
#batfly .bl{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;margin-bottom:4px}
#batfly small{display:block;color:var(--sub);font-size:13px;margin-bottom:12px}
#trbat{border:0;background:transparent;padding:4px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;font-size:12px}
#trbat:active{background:rgba(0,0,0,.07)}
.bathero{display:flex;align-items:center;gap:18px;padding:16px}
.bathero .pct{font-size:34px;font-weight:600;line-height:1}
.bathero small{display:block;color:var(--sub);font-size:13px;margin-top:4px}
.bico{display:inline-block;position:relative;width:64px;height:30px;border:2.5px solid #5f6b7a;border-radius:6px;flex:none}
.bico::after{content:"";position:absolute;right:-7px;top:8px;width:4px;height:10px;border-radius:0 2px 2px 0;background:#5f6b7a}
.bico>i{position:absolute;left:3px;top:3px;bottom:3px;border-radius:2px;background:#3a9d4a}
.bico.low>i{background:#c42b1c}
.bico .ch{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;text-shadow:0 0 3px #000}

/* ---------- сповіщення, модальні ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tbh) + 14px);transform:translate(-50%,20px);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;max-width:calc(100vw - 24px);text-align:center;opacity:0;pointer-events:none;transition:.2s;z-index:8000}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7000;display:grid;place-items:center;padding:12px}
.dlg{background:#fff;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.4);width:min(460px,100%);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow:hidden}
.dlg header{padding:12px 16px;background:#f3f3f3;border-bottom:1px solid #e0e0e0;font-weight:600;font-size:14px}
.dlg .db{padding:16px;overflow:auto;font-size:14px;line-height:1.45}
.dlg footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;background:#f3f3f3;border-top:1px solid #e0e0e0}
.dlg footer:empty{display:none}
.btn{border:1px solid #c9c9c9;background:#fdfdfd;border-radius:5px;padding:7px 18px;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:active{filter:brightness(.92)}
.spin{width:28px;height:28px;border:3px solid #cfe3f7;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.hint li{margin-bottom:6px}

/* ---------- таблиці ---------- */
.tblwrap{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain;background:#fff}
.tbl{border-collapse:separate;border-spacing:0;width:100%;min-width:620px;font-size:13px;background:#fff}
.tbl th{position:sticky;top:0;z-index:2;background:#fff;font-weight:400;text-align:right;padding:6px 10px 4px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
.tbl th .hv{display:block;font-size:15px;line-height:1.2;min-height:18px}
.tbl th .hl{display:block;font-size:12px;color:var(--sub)}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:#fff;max-width:260px}
.tbl th:first-child{z-index:3}
.tbl td{padding:0 10px;height:36px;text-align:right;border-bottom:1px solid #f1f1f1;white-space:nowrap}
.tbl td:first-child{overflow:hidden;text-overflow:ellipsis}
.tbl tr.grp td{background:#f7f7f7!important;font-weight:600;color:#2a2a2a;height:30px;font-size:12px}
.tbl tr.sel td{background:var(--sel)!important}
.tbl tr.kid td:first-child{padding-left:40px}
.tbl .nm{display:flex;align-items:center;gap:8px}
.tbl .chev{width:14px;display:inline-flex;justify-content:center;color:#666;flex:none}
.tbl th.sortable{cursor:pointer}
.tbl th.l,.tbl td.l{text-align:left}
.tblwrap{container-type:inline-size}
@container (max-width:540px){
  .tbl{min-width:0;font-size:12px}
  .tbl th,.tbl td{padding-left:6px;padding-right:6px}
  .tbl th:first-child,.tbl td:first-child{max-width:112px;min-width:112px}
  .tbl td:first-child{white-space:normal;line-height:1.15}
  .tbl .nm{gap:3px}
  .tbl .chev{width:12px}
  .tbl tr.kid td:first-child{padding-left:20px}
  .tbl th .hv{font-size:14px}
}
.tmhd{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:none;flex-wrap:wrap}
.tmhd h2{margin:0;font-size:18px;font-weight:600;flex:1;min-width:120px}
.tmhd .btn{padding:5px 12px;font-size:13px}

/* ---------- диспетчер завдань ---------- */
.tm{display:flex;height:100%;position:relative;background:var(--bg)}
.tm-rail{width:46px;flex:none;background:#eef2f8;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:6px 4px;gap:2px;z-index:20;overflow:hidden}
.tm-rail.ex{width:220px;position:absolute;inset:0 auto 0 0;box-shadow:4px 0 16px rgba(0,0,0,.18)}
.tm-rail button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:5px;padding:0 10px;height:38px;white-space:nowrap;text-align:left;position:relative}
.tm-rail button.on{background:#dfe9f6}
.tm-rail button.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.tm-rail .sp{flex:1}
.tm-pg{flex:1;min-width:0;display:flex;flex-direction:column}
.tm-bd{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tm-bd>.perf{flex:1;height:auto;min-height:0}
.perf{display:grid;grid-template-columns:210px 1fr;height:100%;min-height:0}
.pl{overflow:auto;border-right:1px solid var(--line);padding:6px;background:#fafafa}
.pli{display:flex;gap:8px;align-items:center;padding:8px;border-radius:6px;border:1px solid transparent}
.pli.on{background:#dfe9f6;border-color:#bcd3ee}
.pli canvas{width:62px;height:42px;border:1px solid #c9d3e0;background:#fff;flex:none}
.pli b{display:block;font-size:13px}
.pli small{display:block;color:var(--sub);font-size:11.5px;line-height:1.3}
.pd{overflow:auto;padding:14px 16px;background:#fff;min-width:0}
.pd h3{margin:0;font-size:20px;font-weight:600}
.pd .sub{color:var(--sub);font-size:12px;margin:2px 0 10px}
.pd canvas.big{width:100%;aspect-ratio:600/200;border:1px solid #b8c7da;background:#fbfdff;display:block}
.pd .lbl{display:flex;justify-content:space-between;color:var(--sub);font-size:11.5px;margin:3px 0 10px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;font-size:12.5px}
.stg .sts div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #f0f0f0}
.stg .sts div span:first-child{color:var(--sub)}
.stg .sts div span:last-child{text-align:right;font-weight:500}
@container (max-width:640px){
  .perf{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .pl{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .pli{min-width:176px}
  .stg{grid-template-columns:1fr}
}

/* ---------- провідник ---------- */
.ex{display:flex;flex-direction:column;height:100%;background:#fff;position:relative}
.ex-top{display:flex;align-items:center;gap:6px;padding:8px;background:var(--bg);flex:none}
.ex-top .nb{width:34px;height:32px;border:0;background:transparent;border-radius:5px;display:grid;place-items:center;padding:0}
.ex-top .nb:active{background:#e0e0e0}
.ex-top .nb[disabled]{opacity:.35}
.ex-addr{flex:1;min-width:0;height:32px;background:#fff;border:1px solid #d4d4d4;border-radius:5px;display:flex;align-items:center;gap:4px;padding:0 10px;overflow:hidden;white-space:nowrap;font-size:13px}
.ex-srch{width:150px;height:32px;background:#fff;border:1px solid #d4d4d4;border-radius:5px;padding:0 10px;display:flex;align-items:center;color:#888;gap:6px;font-size:13px}
.ex-cmd{display:flex;gap:16px;padding:6px 12px;border-bottom:1px solid var(--line);color:#777;font-size:13px;flex:none;overflow:hidden;white-space:nowrap}
.ex-main{flex:1;display:flex;min-height:0;position:relative}
.ex-nav{width:200px;flex:none;overflow:auto;padding:6px;border-right:1px solid var(--line);background:#fff}
.nvi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;font-size:13px}
.nvi.on{background:var(--sel)}
.nvi.sub{padding-left:28px}
.nvh{font-size:12px;color:var(--sub);padding:10px 10px 4px}
.ex-view{flex:1;min-width:0;overflow:auto;overscroll-behavior:contain;padding:10px 14px}
.ex-st{height:26px;flex:none;border-top:1px solid var(--line);padding:4px 12px;font-size:12px;color:var(--sub);background:#fff}
.sec{font-size:13px;font-weight:600;color:#222;margin:6px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:14px}
.tile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;border:1px solid transparent;font-size:13px}
.tile.sel,.drive.sel{background:var(--sel);border-color:#9cc8ee}
.drive{display:flex;gap:12px;align-items:center;padding:10px;border-radius:6px;border:1px solid transparent;max-width:340px}
.drive .dn{font-size:13.5px}
.dbar{height:14px;border:1px solid #c5c5c5;background:#e6e6e6;margin:5px 0 4px;width:100%}
.dbar>div{height:100%;background:#26a0da}
.dbar.low>div{background:#da2626}
.drive small{color:var(--sub);font-size:12px}
.flist{width:100%;border-collapse:collapse;font-size:13px;min-width:430px}
.flist th{font-weight:400;text-align:left;color:var(--sub);padding:4px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.flist td{padding:6px 10px;white-space:nowrap}
.flist td.r,.flist th.r{text-align:right}
.frow.sel td{background:var(--sel)}
.flist td:first-child{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--sub);padding:30px 6px;text-align:center}
.hamb{display:none!important}
@container (max-width:600px){
  .ex-nav{display:none;position:absolute;left:0;top:0;bottom:0;z-index:5;box-shadow:4px 0 16px rgba(0,0,0,.2)}
  .ex-nav.show{display:block}
  .hamb{display:grid!important}
  .ex-srch{display:none}
  .flist .c-date,.flist .c-type{display:none}
  .flist{min-width:0}
}

/* ---------- диспетчер пристроїв ---------- */
.dm{display:flex;flex-direction:column;height:100%;background:#fff;font-size:13px;width:100%}
.dm-menu{display:flex;gap:16px;padding:6px 12px;border-bottom:1px solid var(--line);flex:none;color:#333}
.dm-tb{display:flex;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);flex:none;color:#888}
.dm-tb span{width:26px;height:24px;display:grid;place-items:center;border-radius:4px;background:#f2f2f2;font-size:12px}
.dm-tree{flex:1;overflow:auto;padding:6px 4px;overscroll-behavior:contain}
.tn{display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:4px;white-space:nowrap}
.tn.sel{background:var(--sel)}
.tn .chev{width:14px;display:inline-flex;justify-content:center;color:#666;flex:none}
.tkids{margin-left:20px;border-left:1px dotted #bbb;padding-left:4px}
.dm-st{flex:none;border-top:1px solid var(--line);padding:5px 10px;font-size:12px;color:var(--sub)}
.prp{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:12px 0;font-size:13px}
.prp span:nth-child(odd){color:var(--sub)}
.statbox{border:1px solid #cfcfcf;border-radius:4px;padding:10px;margin-top:10px;background:#fafafa}

/* ---------- налаштування ---------- */
.st{display:flex;height:100%;position:relative;background:var(--bg)}
.st-nav{width:270px;flex:none;overflow:auto;padding:12px 10px;background:var(--bg);z-index:5}
.st-user{display:flex;align-items:center;gap:12px;padding:6px 8px 14px}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6ea8ff,#3a63d1);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:600;flex:none}
.st-srch{background:#fff;border:1px solid #d6d6d6;border-radius:5px;padding:7px 10px;color:#888;margin:0 4px 10px;font-size:13px}
.sni{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:6px;font-size:14px;position:relative}
.sni.on{background:#e6e6e6}
.sni.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
.gi{display:inline-flex;width:22px;height:22px;flex:none}
.gi svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.st-main{flex:1;min-width:0;overflow:auto;padding:14px 22px 24px;overscroll-behavior:contain}
.st-h{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.st-h h1{margin:0;font-size:26px;font-weight:600;line-height:1.2}
.st-h h1 .bc{color:var(--sub)}
.st-ham{display:none;width:38px;height:36px;border:0;background:transparent;border-radius:5px;place-items:center;padding:0;flex:none}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:62px}
.row+.row{border-top:1px solid #efefef}
.row .gi{width:24px;height:24px}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-weight:400;font-size:14px}
.row .rt small{display:block;color:var(--sub);font-size:12px;margin-top:1px}
.row .rv{color:var(--sub);font-size:13px;text-align:right}
.row.link:active{background:#f3f7fc}
.devcard{display:flex;align-items:center;gap:16px;padding:6px 2px 16px}
.devcard h2{margin:0;font-size:20px;font-weight:600}
.devcard small{color:var(--sub)}
.st-sec{font-size:15px;font-weight:600;margin:20px 0 8px;display:flex;align-items:center}
.kv{display:grid;grid-template-columns:200px 1fr;gap:10px 12px;padding:14px 16px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--sub)}
.kv div{overflow-wrap:anywhere}
.cbtn{margin-left:auto;font-size:13px;padding:5px 14px}
.bar{height:10px;border-radius:5px;background:#e6e6e6;overflow:hidden;margin:6px 0 0}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.red>i{background:#c42b1c}
@container (max-width:680px){
  .st-nav{display:none;position:absolute;left:0;top:0;bottom:0;box-shadow:4px 0 18px rgba(0,0,0,.25);width:min(290px,86%)}
  .st-nav.show{display:block}
  .st-ham{display:grid}
  .st-main{padding:10px 12px 20px}
  .st-h h1{font-size:21px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv div:nth-child(even){margin-bottom:10px}
}

/* ---------- Chrome ---------- */
.ch{display:flex;flex-direction:column;height:100%;background:#fff;width:100%}
.ch-tabs{display:flex;gap:2px;background:#dde3ee;padding:6px 6px 0;overflow-x:auto;flex:none}
.ch-tab{flex:none;max-width:150px;min-width:110px;background:#e8edf5;border-radius:8px 8px 0 0;padding:7px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tab.on{background:#fff}
.ch-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #e3e3e3;flex:none}
.ch-url{flex:1;background:#eef1f6;border-radius:16px;padding:6px 14px;color:#555;font-size:13px}
.ch-pg{flex:1;display:grid;place-items:center;padding:20px;text-align:center;overflow:auto}
.ch-pg>div{max-width:420px}
</style>

/* торкання: одинарне / подвійне; довге утримання */
function tapper(node,{tap,dbl}){
  let last=0;
  node.addEventListener('click',e=>{
    const t=Date.now();
    if(t-last<450){last=0;dbl&&dbl(e);} else {last=t;tap&&tap(e);}
  });
}
function longPress(node,fn,ms=520){
  let timer,fired=false,sx=0,sy=0;
  const trigger=e=>{clearTimeout(timer);if(fired)return;fired=true;fn(e);};
  node.addEventListener('pointerdown',e=>{fired=false;sx=e.clientX;sy=e.clientY;clearTimeout(timer);timer=setTimeout(()=>trigger(e),ms);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>node.addEventListener(n,()=>clearTimeout(timer)));
  node.addEventListener('pointermove',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)clearTimeout(timer);});
  node.addEventListener('contextmenu',e=>{e.preventDefault();trigger(e);});
  node.addEventListener('click',e=>{if(fired){e.stopImmediatePropagation();e.preventDefault();fired=false;}},true);
}

const RAM=PC.ram;

    p.mem=Math.round((RAM.usedMB-others.reduce((s,x)=>s+x.mem,0))*10)/10;
    p.cpu=Math.round((PC.cpu.target-others.reduce((s,x)=>s+x.cpu,0))*10)/10;
  });
  P.forEach(p=>{p.cpu0=p.cpu;p.mem0=p.mem;p.disk0=p.disk;p.net0=p.net;p.gpu0=p.gpu;});
  const ch=P.find(p=>p.kids);
  if(ch){
    const w=PC.tabs.map((_,i)=>40+(i*7)%35), sw=w.reduce((a,b)=>a+b,0), mainMem=150, mainCpu=2;
    ch.kids=PC.tabs.map((t,i)=>({id:'tab'+i,name:'Вкладка: '+t,grp:'kid',pid:4200+i*8,
      cpu0:(ch.cpu0-mainCpu)*w[i]/sw,mem0:(ch.mem0-mainMem)*w[i]/sw,disk0:0,net0:ch.net0*w[i]/sw,gpu0:ch.gpu0*w[i]/sw}));
    ch.kids.forEach(k=>{k.cpu=k.cpu0;k.mem=k.mem0;k.disk=0;k.net=k.net0;k.gpu=k.gpu0;});
  }
})();

const M={cpu:0,mem:0,memPct:0,disk:0,net:0,gpu:0,speed:PC.cpu.boost,hCpu:[],hMem:[],hDisk:[],hNet:[],hGpu:[],procs:0,threads:0,handles:0,start:Date.now()-((3*3600+41*60)*1000)};
function tick(){
  P.forEach(p=>{
    p.cpu=p.cpu0*(1+rnd(-.035,.035));
    p.mem=p.mem0+rnd(-1,1)*(p.mem0>300?1.6:.25);
    p.disk=Math.max(0,p.disk0*(1+rnd(-.6,.9)));
    p.net=Math.max(0,p.net0*(1+rnd(-.5,.5)));
    p.gpu=Math.max(0,p.gpu0*(1+rnd(-.1,.1)));
    if(p.kids){const fc=p.cpu/p.cpu0,fm=p.mem/p.mem0;p.kids.forEach(k=>{k.cpu=k.cpu0*fc;k.mem=k.mem0*fm;k.net=k.net0*(p.net/(p.net0||1));k.gpu=k.gpu0*(p.gpu/(p.gpu0||1));});}
  });
  M.cpu=clamp(P.reduce((s,p)=>s+p.cpu,0),0,100);
  M.mem=P.reduce((s,p)=>s+p.mem,0);
  M.memPct=M.mem/RAM.usableMB*100;
  M.disk=clamp((PC.disk.activity||15)+rnd(-4,5),0,100);
  M.net=P.reduce((s,p)=>s+p.net,0);
  M.gpu=clamp(P.reduce((s,p)=>s+p.gpu,0)*0.45,0,100);
  M.speed=PC.cpu.boost+rnd(-.04,.06);
  M.procs=142+Math.round(rnd(-1,1));M.threads=1983+Math.round(rnd(-6,6));M.handles=61250+Math.round(rnd(-40,40));
  const push=(a,v)=>{a.push(v);if(a.length>60)a.shift();};
  push(M.hCpu,M.cpu);push(M.hMem,M.memPct);push(M.hDisk,M.disk);push(M.hNet,clamp(M.net*12,0,100));push(M.hGpu,M.gpu);
}
for(let i=0;i<60;i++)tick();

/* =====================================================================
   Таблиця (спільна для диспетчера завдань)
   ===================================================================== */
function makeTable({cols,groups,sort,expand=false,onTap}){
  const S={key:sort.key,dir:sort.dir,open:new Set(),sel:null,map:new Map()};
  const wrap=el('div','tblwrap');
  const val=(c,r)=>c.val?c.val(r):r[c.k];
  function sorted(rows){
    const c=cols.find(x=>x.k===S.key);if(!c)return rows;
    return [...rows].sort((a,b)=>{const x=val(c,a),y=val(c,b);
      return (typeof x==='string'?x.localeCompare(y,'uk'):(x-y))*S.dir;});
  }
  function render(){
    S.map.clear();
    const heads=cols.map(c=>`<th class="sortable${c.left?' l':''}" data-k="${c.k}">${c.head?`<span class="hv"></span>`:''}<span class="hl">${c.label}${S.key===c.k?(S.dir>0?' ▲':' ▼'):''}</span></th>`).join('');
    let body='';
    groups().forEach(g=>{
      if(g.title)body+=`<tr class="grp"><td colspan="${cols.length}">${g.title} (${g.rows.length})</td></tr>`;
      sorted(g.rows).forEach(r=>{
        const kids=!!(r.kids&&expand);
        body+=rowHtml(r,0,kids);
        if(kids&&S.open.has(r.id))sorted(r.kids).forEach(k=>body+=rowHtml(k,1,false));
      });
    });
    wrap.innerHTML=`<table class="tbl"><thead><tr>${heads}</tr></thead><tbody>${body}</tbody></table>`;
    $$('th',wrap).forEach(th=>{th._c=cols.find(x=>x.k===th.dataset.k);});
    paintHeads();
  }
  function rowHtml(r,lvl,hasKids){
    S.map.set(r.id,r);
    const open=S.open.has(r.id);
    const cells=cols.map((c,i)=>{
      const st=c.style?c.style(r):'';
      if(i===0)return `<td data-k="${c.k}"><span class="nm">${hasKids?`<span class="chev">${gl(open?'chevD':'chevR',12)}</span>`:'<span class="chev"></span>'}${c.cell(r)}</span></td>`;
      return `<td data-k="${c.k}" class="${c.left?'l':''}" style="${st}">${c.cell(r)}</td>`;
    }).join('');
    return `<tr data-id="${r.id}" class="${lvl?'kid':''} ${S.sel===r.id?'sel':''}">${cells}</tr>`;
  }
  function paintHeads(){
    $$('th',wrap).forEach(th=>{const c=th._c;if(c&&c.head){$('.hv',th).textContent=c.head();th.style.background=c.headStyle?c.headStyle():'';}});
  }
  function update(){
    $$('tr[data-id]',wrap).forEach(tr=>{
      const r=S.map.get(tr.dataset.id);if(!r)return;
      cols.forEach((c,i)=>{if(i===0)return;const td=tr.children[i];td.innerHTML=c.cell(r);td.style.cssText=c.style?c.style(r):'';});
    });
    paintHeads();
  }
  wrap.addEventListener('click',e=>{
    const th=e.target.closest('th.sortable');
    if(th){const k=th.dataset.k;if(S.key===k)S.dir*=-1;else{S.key=k;S.dir=(th._c&&th._c.alpha)?1:-1;}render();return;}
    const tr=e.target.closest('tr[data-id]');
    if(tr){const id=tr.dataset.id;S.sel=id;const r=S.map.get(id);
      if(expand&&r&&r.kids){S.open.has(id)?S.open.delete(id):S.open.add(id);render();}
      else{$$('tr.sel',wrap).forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');}
      onTap&&onTap(r);}
  });
  render();
  return {el:wrap,render,update};
}

const RAIL=[['proc','Процеси'],['perf','Продуктивність'],['hist','Журнал програм'],['start','Автозавантаження програм'],['users','Користувачі'],['det','Відомості'],['svc','Служби']];

  const pages={proc:pProc,perf:pPerf,hist:pHist,start:pStart,users:pUsers,det:pDet,svc:pSvc};

  function drawRail(){
    rail.innerHTML='';
    const ex=rail.classList.contains('ex');
    const mk=(key,icon,text,on,fn)=>{const b=el('button',on?'on':'',`<span style="width:20px;display:grid;place-items:center;flex:none">${gl(icon,18)}</span><span>${ex?text:''}</span>`);b.onclick=fn;b.setAttribute('aria-label',text||'Меню');rail.appendChild(b);};

  }
  function show(){
    pg.innerHTML='';cur=pages[page]();pg.appendChild(cur.el);

  }
  function head(title,btns=[]){
    const h=el('div','tmhd',`<h2>${title}</h2>`);
    btns.forEach(([t,fn])=>{const b=el('button','btn',t);b.onclick=fn;h.appendChild(b);});return h;
  }
  const wrapPage=(h,content,upd)=>{const d=el('div','tm-bd');d.append(h,content.el||content);return {el:d,update:upd||(()=>content.update&&content.update())};};

  /* --- Процеси --- */
  function pProc(){
    const T=makeTable({
      expand:true,sort:{key:'name',dir:1},
      cols:[
        {k:'name',label:'Ім\'я',cell:r=>r.name,val:r=>r.name,alpha:true},
        {k:'cpu',label:'ЦП',head:()=>Math.round(M.cpu)+'%',headStyle:()=>heat(M.cpu),cell:r=>f1(r.cpu)+NB+'%',style:r=>'background:'+heat(r.cpu)},

        {k:'disk',label:'Диск',head:()=>Math.round(M.disk)+'%',headStyle:()=>heat(M.disk),cell:r=>f1(r.disk)+NB+'МБ/с',style:r=>'background:'+heat(r.disk*8)},

        {k:'gpu',label:'ГП',head:()=>Math.round(M.gpu)+'%',headStyle:()=>heat(M.gpu),cell:r=>f1(r.gpu)+NB+'%',style:r=>'background:'+heat(r.gpu)}
      ],
      groups:()=>[{title:'Програми',rows:P.filter(p=>p.grp==='app')},{title:'Фонові процеси',rows:P.filter(p=>p.grp==='bg')}]
    });
    return wrapPage(head('Процеси',[['Запустити нове завдання',denied],['Завершити завдання',denied]]),T);
  }

  /* --- Продуктивність --- */
  const uptime=()=>{const s=Math.floor((Date.now()-M.start)/1000);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;return `${d}:${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`;};
  function pPerf(){
    const dsum=()=>P.reduce((s,p)=>s+p.disk,0);
    const defs=[
      {k:'cpu',t:'ЦП',color:'#1b7bc7',h:()=>M.hCpu,sub:()=>`${Math.round(M.cpu)}%${NB}${f2(M.speed)}${NB}ГГц`,name:PC.cpu.name,
        lab:'Використання ЦП за 60 секунд, %',stats:()=>[
          [['Використання',Math.round(M.cpu)+'%'],['Швидкість',f2(M.speed)+NB+'ГГц'],['Процеси',grp(M.procs)],['Потоки',grp(M.threads)],['Дескриптори',grp(M.handles)],['Час роботи',uptime()]],
          [['Базова швидкість:',f2(PC.cpu.base)+NB+'ГГц'],['Сокети:',PC.cpu.sockets],['Ядра:',PC.cpu.cores],['Логічні процесори:',PC.cpu.threads],['Віртуалізація:','Вимкнено'],['Кеш L1:',PC.cpu.l1],['Кеш L2:',PC.cpu.l2],['Кеш L3:',PC.cpu.l3]]]},
      {k:'mem',t:'Пам\'ять',color:'#8e44ad',h:()=>M.hMem,sub:()=>`${f1(M.mem/1024)}/${f1(RAM.usableMB/1024)}${NB}ГБ (${Math.round(M.memPct)}%)`,name:RAM.installed,
        lab:'Використання пам\'яті, %',stats:()=>[
          [['Використовується',f1(M.mem/1024)+NB+'ГБ'],['Доступно',f2((RAM.usableMB-M.mem)/1024)+NB+'ГБ'],['Встановлено',RAM.installed],['Кеш','0,3'+NB+'ГБ'],['Закріплений пул','210'+NB+'МБ']],
          [['Швидкість:',RAM.speed],['Використані гнізда:',RAM.slots],['Форм-фактор:',RAM.form],['Зарезервовано апаратурою:',(RAM.totalMB-RAM.usableMB)+NB+'МБ']]]},
      {k:'disk',t:'Диск 0 (C:)',color:'#3a9d4a',h:()=>M.hDisk,sub:()=>`${PC.disk.type}${NB}${Math.round(M.disk)}%`,name:PC.disk.model,
        lab:'Активний час, %',stats:()=>[
          [['Активний час',Math.round(M.disk)+'%'],['Середній час відповіді',f1(rnd(3,6))+NB+'мс'],['Швидкість читання',f1(dsum()*.4)+NB+'МБ/с'],['Швидкість запису',f1(dsum()*.6)+NB+'МБ/с']],
          [['Ємність:',PC.disk.totalGB+NB+'ГБ'],['Відформатовано:',PC.disk.totalGB+NB+'ГБ'],['Вільно:',f1(PC.disk.freeGB)+NB+'ГБ'],['Системний диск:','Так'],['Файл підкачки:','Так'],['Тип:',PC.disk.type]]]},
      {k:'net',t:PC.net.label,color:'#d9772b',h:()=>M.hNet,sub:()=>`Н:${NB}${f1(M.net*.15)}${NB}П:${NB}${f1(M.net*.85)}${NB}Мбіт/с`,name:PC.net.ssid,
        lab:'Пропускна здатність, Мбіт/с',stats:()=>[
          [['Надсилання',f1(M.net*.15)+NB+'Мбіт/с'],['Отримання',f1(M.net*.85)+NB+'Мбіт/с']],
          [['Ім\'я мережі:',PC.net.ssid],['Тип:',PC.net.type],['IPv4-адреса:',PC.net.ip]]]},
      {k:'gpu',t:'ГП 0',color:'#1b7bc7',h:()=>M.hGpu,sub:()=>`${PC.gpu.name.replace('Intel(R) ','')}${NB}${Math.round(M.gpu)}%`,name:PC.gpu.name,
        lab:'Використання ГП, %',stats:()=>[
          [['Використання',Math.round(M.gpu)+'%'],[PC.gpu.memLabel,PC.gpu.memVal]],
          [['Версія драйвера:',PC.gpu.driver],['Дата розробки:',PC.gpu.driverDate]]]}
    ];
    const root=el('div','perf'),list=el('div','pl'),det=el('div','pd');root.append(list,det);
    defs.forEach(d=>{
      const it=el('div','pli'+(d.k===perfSel?' on':''),`<canvas width="124" height="84"></canvas><div><b>${d.t}</b><small data-s></small></div>`);
      it.onclick=()=>{perfSel=d.k;$$('.pli',list).forEach(x=>x.classList.remove('on'));it.classList.add('on');buildDet();upd();};
      d.mini=$('canvas',it);d.sm=$('[data-s]',it);list.appendChild(it);
    });
    let big,statsEl;
    function buildDet(){
      const d=defs.find(x=>x.k===perfSel);
      det.innerHTML=`<h3>${d.t}</h3><div class="sub">${d.name}</div><canvas class="big" width="600" height="200"></canvas><div class="lbl"><span>${d.lab}</span><span>60 секунд → 0</span></div><div class="stg"><div class="sts"></div><div class="sts"></div></div>`;
      big=$('canvas.big',det);statsEl=$$('.sts',det);
    }
    function chart(cv,data,color,thick){
      const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.clearRect(0,0,W,H);
      c.strokeStyle='#e6edf5';c.lineWidth=1;
      for(let i=1;i<10;i++){c.beginPath();c.moveTo(0,H*i/10);c.lineTo(W,H*i/10);c.stroke();}
      const n=data.length,pts=data.map((v,i)=>[i/(n-1)*W,H-clamp(v,0,100)/100*(H-3)-1.5]);
      c.beginPath();c.moveTo(0,H);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(W,H);c.closePath();c.fillStyle=color+'30';c.fill();
      c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=color;c.lineWidth=thick;c.stroke();
    }
    function upd(){
      defs.forEach(d=>{chart(d.mini,d.h(),d.color,2);d.sm.textContent=d.sub();});
      const d=defs.find(x=>x.k===perfSel);chart(big,d.h(),d.color,3);
      const [a,b]=d.stats();
      const html=arr=>arr.map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join('');
      statsEl[0].innerHTML=html(a);statsEl[1].innerHTML=html(b);
    }
    buildDet();upd();

    const T=makeTable({expand:true,sort:{key:'name',dir:1},cols:[
      {k:'name',label:'Користувач',alpha:true,cell:r=>r.name,val:r=>r.name},
      {k:'cpu',label:'ЦП',cell:r=>f1(r.cpu)+NB+'%',style:r=>'background:'+heat(r.cpu)},
      {k:'mem',label:'Пам\'ять',cell:r=>mbText(r.mem),style:r=>'background:'+heat(r.mem/RAM.usableMB*100)},
      {k:'disk',label:'Диск',cell:r=>f1(r.disk)+NB+'МБ/с'},{k:'net',label:'Мережа',cell:r=>f1(r.net)+NB+'Мбіт/с'}
    ],groups:()=>[{rows:[user]}]});
    return wrapPage(head('Користувачі',[['Від\'єднати',denied]]),T);
  }
  /* --- Відомості --- */
  function pDet(){
    const extra=[['System Idle Process',0,'0'],['Registry',92,'48'],['smss.exe',372,'68'],['csrss.exe',520,'2 600'],['wininit.exe',612,'1 400'],['services.exe',748,'6 100'],['lsass.exe',768,'12 300'],['svchost.exe',904,'18 400'],['dwm.exe',1088,'62 800'],['svchost.exe',1204,'14 100'],['ctfmon.exe',3320,'7 200'],['SearchHost.exe',4640,'38 500']];
    const ex=extra.map((r,i)=>({id:'x'+i,name:r[0],pid:r[1],cpu:0,memKB:+r[2].replace(/\s/g,''),desc:'Системний процес'}));
    const live=P.map(p=>({id:'d'+p.id,name:p.exe,get cpu(){return p.cpu},get memKB(){return p.mem*1024},pid:p.pid,desc:p.desc}));
    const rows=[...ex,...live];
    const T=makeTable({sort:{key:'pid',dir:1},cols:[
      {k:'name',label:'Ім\'я',alpha:true,cell:r=>r.name,val:r=>r.name},{k:'pid',label:'Ідентифікатор процесу',cell:r=>r.pid,val:r=>r.pid},
      {left:true,k:'st',label:'Стан',cell:r=>'Виконується',val:r=>0},{left:true,k:'user',label:'Користувач',cell:r=>r.pid<400?'СИСТЕМА':PC.owner,val:r=>r.pid<400?'СИСТЕМА':PC.owner},
      {k:'cpu',label:'ЦП',cell:r=>Math.round(r.cpu)+NB+'%',val:r=>r.cpu},{k:'memKB',label:'Пам\'ять (активний закритий пул)',cell:r=>grp(r.memKB)+NB+'КБ',val:r=>r.memKB},{left:true,k:'desc',label:'Опис',cell:r=>r.desc,val:r=>r.desc}
    ],groups:()=>[{rows}]});
    return wrapPage(head('Відомості'),T);
  }
  /* --- Служби --- */
  function pSvc(){
    const rows=PC.services.map((r,i)=>({id:'v'+i,name:r[0],pid:r[1]===''?0:r[1],desc:r[2],st:r[3],grp2:r[4]}));
    const T=makeTable({sort:{key:'name',dir:1},cols:[
      {k:'name',label:'Ім\'я',alpha:true,cell:r=>r.name,val:r=>r.name},{k:'pid',label:'Ідентифікатор процесу',cell:r=>r.pid||'',val:r=>r.pid},
      {left:true,k:'desc',label:'Опис',cell:r=>r.desc,val:r=>r.desc},{left:true,k:'st',label:'Стан',cell:r=>r.st,val:r=>r.st},{left:true,k:'grp2',label:'Група',cell:r=>r.grp2,val:r=>r.grp2}

/* =====================================================================
   Додаток: Провідник
   ===================================================================== */
const TYPE={folder:'Папка з файлами',doc:'Документ',img:'Файл JPG',ppt:'Презентація',video:'Відеофайл',exe:'Програма',pdf:'Документ PDF',zip:'Архів ZIP',audio:'Аудіофайл'};
const LOCNAME={desktop:'Робочий стіл',documents:'Документи',downloads:'Завантаження',pictures:'Зображення',music:'Музика',videos:'Відео'};
function locTitle(loc){
  if(loc==='thispc')return ['Цей ПК'];
  if(LOCNAME[loc])return ['Цей ПК',LOCNAME[loc]];
  const [,...rest]=loc.split('/');return ['Цей ПК',PC.disk.label,...rest];
}
function buildExplorer(body,w,opts){
  const root=el('div','cq');
  root.innerHTML=`<div class="ex">
    <div class="ex-top"><button class="nb hamb" data-a="ham" aria-label="Меню">${gl('menu',18)}</button><button class="nb" data-a="back" aria-label="Назад">${gl('back',18)}</button><button class="nb" data-a="up" aria-label="Вгору">${gl('up',18)}</button><div class="ex-addr"></div><div class="ex-srch">${gl('search',14)} Пошук</div></div>
    <div class="ex-cmd"><span>＋ Створити</span><span>Вирізати</span><span>Копіювати</span><span>Видалити</span><span>⇅ Сортувати</span><span>☰ Вигляд</span></div>
    <div class="ex-main"><nav class="ex-nav"></nav><div class="ex-view"></div></div>
    <div class="ex-st"></div></div>`;
  body.appendChild(root);
  const addr=$('.ex-addr',root),nav=$('.ex-nav',root),view=$('.ex-view',root),stat=$('.ex-st',root),backB=$('[data-a=back]',root);
  let loc=(opts&&opts.page)||'thispc',hist=[];
  const free=PC.disk.freeGB,tot=PC.disk.totalGB,low=free/tot<0.1;

  function go(l,push=true){if(push&&l!==loc)hist.push(loc);loc=l;nav.classList.remove('show');render();}
  w.nav=l=>go(l);
  function parent(l){if(l==='thispc')return null;if(LOCNAME[l]||l==='c')return 'thispc';return l.split('/').slice(0,-1).join('/')||'c';}

  root.addEventListener('click',e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const a=b.dataset.a;
    if(a==='back'&&hist.length)go(hist.pop(),false);
    if(a==='up'){const p=parent(loc);if(p)go(p);}
    if(a==='ham')nav.classList.toggle('show');
  });

  function drawNav(){
    const items=[['desktop','Робочий стіл'],['downloads','Завантаження'],['documents','Документи'],['pictures','Зображення'],['music','Музика'],['videos','Відео']];
    nav.innerHTML=`<div class="nvh">Швидкий доступ</div>`+items.map(([k,t])=>`<div class="nvi ${loc===k?'on':''}" data-l="${k}">${ico('folder',18)}${t}</div>`).join('')+
      `<div class="nvh">&nbsp;</div><div class="nvi ${loc==='thispc'?'on':''}" data-l="thispc">${ico('pc',18)}Цей ПК</div><div class="nvi sub ${loc==='c'?'on':''}" data-l="c">${ico('drive',18)}${PC.disk.label}</div>`;
    $$('.nvi',nav).forEach(n=>n.onclick=()=>go(n.dataset.l));
  }
  function drawAddr(){
    const t=locTitle(loc);
    addr.innerHTML=ico(loc==='thispc'?'pc':'folder',16)+t.map(x=>`<span>${x}</span>`).join('<span style="color:#999">›</span>');
    backB.disabled=!hist.length;
  }
  function selOnly(node,text){$$('.sel',view).forEach(x=>x.classList.remove('sel'));node.classList.add('sel');stat.textContent=text||'Вибрано 1 елемент';}
  function driveTile(){
    const pct=(tot-free)/tot*100;
    const d=el('div','drive',`${ico('drive',42)}<div style="flex:1;min-width:0"><div class="dn">${PC.disk.label}</div><div class="dbar ${low?'low':''}"><div style="width:${pct}%"></div></div><small>${f1(free)}${NB}ГБ вільно з ${tot}${NB}ГБ</small></div>`);
    tapper(d,{tap:()=>selOnly(d),dbl:()=>go('c')});
    longPress(d,e=>showCtx(e.clientX,e.clientY,[['Відкрити',()=>go('c')],['Властивості',driveProps]]));
    return d;
  }
  function driveProps(){
    const gib=1073741824,tb=tot*gib,fb=Math.round(free*gib),ub=tb-fb,r=54,C=2*Math.PI*r,uf=ub/tb;
    modal({title:`Властивості: ${PC.disk.label}`,html:`
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">${ico('drive',34)}<b>${PC.disk.label}</b></div>
      <div class="prp"><span>Тип:</span><span>Локальний диск</span><span>Файлова система:</span><span>NTFS</span></div>
      <div class="prp" style="grid-template-columns:auto 1fr;margin:6px 0"><span style="color:#222">Зайнято:</span><span>${grp(ub)}${NB}байт · ${f1(tot-free)}${NB}ГБ</span><span style="color:#222">Вільно:</span><span>${grp(fb)}${NB}байт · ${f1(free)}${NB}ГБ</span><span style="color:#222">Ємність:</span><span>${grp(tb)}${NB}байт · ${tot}${NB}ГБ</span></div>
      <div style="display:grid;place-items:center;margin:10px 0"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#e5e5e5" stroke-width="22"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${low?'#da2626':'#26a0da'}" stroke-width="22" stroke-dasharray="${C*uf} ${C}" transform="rotate(-90 70 70)"/></svg><div style="font-size:12px;color:#666">Диск C: ${Math.round(uf*100)}% зайнято</div></div>`,
      buttons:[{t:'Очищення диска',fn:denied},{t:'Закрити',pri:true}]});
  }
  function render(){
    drawNav();drawAddr();view.innerHTML='';
    if(loc==='thispc'){
      const folders=[['desktop','Робочий стіл'],['downloads','Завантаження'],['documents','Документи'],['music','Музика'],['pictures','Зображення'],['videos','Відео']];
      view.appendChild(el('div','sec','Папки ('+folders.length+')'));
      const tl=el('div','tiles');
      folders.forEach(([k,t])=>{const x=el('div','tile',ico('folder',32)+`<span>${t}</span>`);tapper(x,{tap:()=>selOnly(x),dbl:()=>go(k)});tl.appendChild(x);});
      view.appendChild(tl);
      view.appendChild(el('div','sec','Пристрої та диски (1)'));
      view.appendChild(driveTile());
      stat.textContent='Елементів: '+(folders.length+1);
      return;
    }
    const list=PC.fs[loc];
    if(!list){view.appendChild(el('div','empty',loc.startsWith('c/')?'У цій імітації вміст папки не показується.':'Папка порожня.'));stat.textContent='Елементів: 0';return;}
    const t=el('table','flist');
    t.innerHTML=`<thead><tr><th>Назва</th><th class="c-date">Дата змінення</th><th class="c-type">Тип</th><th class="r">Розмір</th></tr></thead><tbody></tbody>`;
    const tb=$('tbody',t);
    list.forEach(([n,k,d,s])=>{
      const tr=el('tr','frow',`<td>${ico(k,20)}<span>${n}</span></td><td class="c-date">${d}</td><td class="c-type">${TYPE[k]||'Файл'}</td><td class="r">${s==null?'':sizeText(s)}</td>`);
      tapper(tr,{tap:()=>{$$('.sel',tb).forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');stat.textContent='Вибрано 1 елемент'+(s!=null?`: ${sizeText(s)}`:'');},
        dbl:()=>{if(k==='folder')go(loc==='c'?'c/'+n:loc+'/'+n);else toast('Цей файл в імітації не відкривається.');}});
      tb.appendChild(tr);
    });
    view.appendChild(t);stat.textContent='Елементів: '+list.length;
  }
  render();
}

/* =====================================================================

function buildDM(body,w){
  const root=el('div','cq');root.innerHTML=`<div class="dm"><div class="dm-menu"><span>Файл</span><span>Дія</span><span>Вигляд</span><span>Довідка</span></div><div class="dm-tb"><span>◀</span><span>▶</span><span>▦</span><span>?</span><span>↻</span></div><div class="dm-tree"></div><div class="dm-st">Торкніться категорії, щоб розгорнути. Двічі торкніться пристрою — відкриються властивості.</div></div>`;
  body.appendChild(root);
  const tree=$('.dm-tree',root);const open=new Set(),sel={id:null};
  function render(){
    tree.innerHTML='';
    tree.appendChild(el('div','tn',`<span class="chev">${gl('chevD',12)}</span>${ico('pc',18)}<b style="font-weight:600">${PC.device}</b>`));
    const box=el('div','tkids');tree.appendChild(box);
    PC.devices.forEach(([cat,ic,items],ci)=>{
      const isOpen=open.has(ci);
      const row=el('div','tn',`<span class="chev">${gl(isOpen?'chevD':'chevR',12)}</span>${ico(ic,18)}<span>${cat}</span>`);
      row.onclick=()=>{isOpen?open.delete(ci):open.add(ci);render();};
      box.appendChild(row);
      if(isOpen){const kids=el('div','tkids');
        items.forEach(([n,m],ii)=>{const id=ci+'.'+ii;const k=el('div','tn'+(sel.id===id?' sel':''),`<span class="chev"></span>${ico(ic,16)}<span>${n}</span>`);
          tapper(k,{tap:()=>{sel.id=id;$$('.tn.sel',kids).forEach(x=>x.classList.remove('sel'));k.classList.add('sel');},dbl:()=>props(cat,ic,n,m)});kids.appendChild(k);});
        box.appendChild(kids);}
    });
  }
  function props(cat,ic,n,m){
    modal({title:'Властивості: '+n,html:`<div style="display:flex;gap:12px;align-items:center">${ico(ic,36)}<b>${n}</b></div>
      <div class="prp"><span>Тип пристрою:</span><span>${cat}</span><span>Виробник:</span><span>${m}</span><span>Розташування:</span><span>Системна плата</span></div>
      <div class="statbox"><b>Стан пристрою</b><br>Пристрій працює нормально.</div>`,buttons:[{t:'Закрити',pri:true}]});
  }
  render();
}

    const hp=Math.round(B.full/B.design*100),worn=hp<80,low=B.level<=20;
    main.innerHTML=head([['Система','system'],['Живлення і батарея']])+`

      ${rows([['Розрахункова ємність (коли був новий)',grp(B.design)+NB+'мВт·год'],['Повна ємність заряду (зараз)',grp(B.full)+NB+'мВт·год'],['Кількість циклів заряджання',B.cycles],['Тип акумулятора',B.chem]])}</div>
      <p style="color:#666;font-size:12px;margin:8px 2px">Дані про стан — зі звіту про акумулятор, який Windows створює командою <b>powercfg /batteryreport</b>. В імітації їх зібрано на цій сторінці.</p>`;

  function trPage(){
    const items=['Відтворення звуку','Підключення до інтернету','Мережний адаптер','Принтер','Windows Update','Живлення','Bluetooth','Клавіатура'];

    items.forEach(t=>{const r=el('div','row',`${sic('tool','#3b4a5a')}<div class="rt"><b>${t}</b></div><button class="btn">Запустити</button>`);

   Вікна
   ===================================================================== */
const APPS={
  explorer:{title:'Провідник',icon:'folder',build:buildExplorer,size:[820,520]},
  taskmgr:{title:'Диспетчер завдань',icon:'taskmgr',build:buildTM,size:[860,560]},
  devmgr:{title:'Диспетчер пристроїв',icon:'devmgr',build:buildDM,size:[680,520]},
  settings:{title:'Налаштування',icon:'settings',build:buildSettings,size:[920,600]},
  chrome:{title:'Google Chrome',icon:'chrome',build:buildChrome,size:[900,560]}
};
const wins=[];let zTop=10;
const narrow=()=>innerWidth<760;
function openApp(id,opts){
  closeMenus();
  const ex=wins.find(x=>x.app===id);
  if(ex){ex.node.classList.remove('min');if(opts&&opts.page&&ex.nav)ex.nav(opts.page);focus(ex);return ex;}
  const def=APPS[id],node=el('div','win'),w={app:id,node,def};
  node.innerHTML=`<div class="titlebar">${ico(def.icon,16)}<div class="ttitle">${def.title}</div><div class="tbtns"><button class="minb" aria-label="Згорнути">${gl('min')}</button><button class="maxb" aria-label="Розгорнути">${gl('max')}</button><button class="close" aria-label="Закрити">${gl('close')}</button></div></div><div class="wbody"></div>`;
  const aw=$('#windows'),W=Math.min(def.size[0],aw.clientWidth-20),H=Math.min(def.size[1],aw.clientHeight-20),n=wins.length;
  Object.assign(node.style,{width:W+'px',height:H+'px',left:Math.max(6,(aw.clientWidth-W)/2+n*26-26)+'px',top:Math.max(6,(aw.clientHeight-H)/2+n*22-22)+'px'});
  aw.appendChild(node);wins.push(w);
  def.build($('.wbody',node),w,opts);
  $('.minb',node).onclick=()=>{node.classList.add('min');renderTaskbar();};
  $('.maxb',node).onclick=()=>node.classList.toggle('max');
  $('.close',node).onclick=()=>{node.remove();wins.splice(wins.indexOf(w),1);renderTaskbar();};
  node.addEventListener('pointerdown',()=>{if(!node.classList.contains('active'))focus(w);},true);
  /* перетягування за заголовок (широкі екрани) */
  const tb=$('.titlebar',node);let drag=null;
  tb.addEventListener('pointerdown',e=>{if(narrow()||node.classList.contains('max')||e.target.closest('button'))return;drag={x:e.clientX-node.offsetLeft,y:e.clientY-node.offsetTop};tb.setPointerCapture(e.pointerId);});
  tb.addEventListener('pointermove',e=>{if(!drag)return;node.style.left=clamp(e.clientX-drag.x,-W+80,innerWidth-80)+'px';node.style.top=clamp(e.clientY-drag.y,0,innerHeight-120)+'px';});
  tb.addEventListener('pointerup',()=>drag=null);
  tapper(tb,{dbl:e=>{if(!narrow()&&!e.target.closest('button'))node.classList.toggle('max');}});
  focus(w);return w;
}
function focus(w){wins.forEach(x=>x.node.classList.remove('active'));w.node.classList.add('active');w.node.style.zIndex=++zTop;renderTaskbar();}

function renderTaskbar(){
  const box=$('#tbicons');box.innerHTML='';
  const add=(html,cls)=>{const b=el('button','tbb '+cls,html);box.appendChild(b);return b;};
  const sb=add(ico('win',24),'');sb.id='startbtn';sb.setAttribute('aria-label','Пуск');
  sb.onclick=()=>{const w=$('#winx');if(!w.hidden){closeMenus();return;}showWinX();};
  longPress(sb,()=>showWinX());
  ['explorer','chrome'].forEach(id=>tbBtn(add,id));
  wins.filter(w=>!['explorer','chrome'].includes(w.app)).forEach(w=>tbBtn(add,w.app));
}
function tbBtn(add,id){
  const w=wins.find(x=>x.app===id);
  const act=w&&w.node.classList.contains('active')&&!w.node.classList.contains('min');
  const b=add(ico(APPS[id].icon,24),(w?'open ':'')+(act?'act':''));
  b.setAttribute('aria-label',APPS[id].title);
  b.onclick=()=>{closeMenus();
    if(!w)return openApp(id);
    if(w.node.classList.contains('min')){w.node.classList.remove('min');focus(w);}
    else if(w.node.classList.contains('active')){w.node.classList.add('min');renderTaskbar();}
    else focus(w);};
}

/* ---------- меню Пуск і Win+X ---------- */
function closeMenus(){['#start','#winx','#ctx','#batfly'].forEach(s=>{$(s).hidden=true;});}
function toggleStart(){
  const s=$('#start'),was=!s.hidden;closeMenus();if(was)return;
  s.innerHTML=`<div class="srch">${gl('search',16)} Пошук програм, налаштувань і документів</div><h4>Закріплено</h4><div class="pgrid"></div><div class="pfoot"><span style="display:flex;align-items:center;gap:8px"><span class="avatar" style="width:30px;height:30px;font-size:14px">${PC.owner[0]}</span>${PC.owner}</span><span data-p style="padding:6px 10px;border-radius:5px">⏻</span></div>`;
  const g=$('.pgrid',s);
  [['Налаштування','settings',()=>openApp('settings')],['Провідник','folder',()=>openApp('explorer')],['Chrome','chrome',()=>openApp('chrome')],['Диспетчер завдань','taskmgr',()=>openApp('taskmgr')],
   ['Калькулятор','exe',inactive],['Блокнот','doc',inactive],['Фотографії','img',inactive],['Пошта','exe',inactive]].forEach(([t,i,fn])=>{const p=el('div','pit',ico(i,32)+`<span>${t}</span>`);p.onclick=()=>{closeMenus();fn();};g.appendChild(p);});
  $('[data-p]',s).onclick=()=>toast('Вимкнення в імітації не працює.');
  s.hidden=false;
}
function showWinX(){
  closeMenus();const m=$('#winx');m.innerHTML='';
  const items=[['Програми та засоби',inactive],['Налаштування живлення',()=>openApp('settings',{page:'power'})],['Перегляд подій',inactive],['Система',()=>openApp('settings',{page:'about'})],['Диспетчер пристроїв',()=>openApp('devmgr')],['Мережні підключення',inactive],['Керування дисками',inactive],['Керування комп\'ютером',inactive],['Термінал Windows',inactive],['Термінал Windows (адміністратор)',inactive],'-',['Диспетчер завдань',()=>openApp('taskmgr')],['Налаштування',()=>openApp('settings')],['Провідник',()=>openApp('explorer')],['Пошук',inactive],['Виконати',inactive],'-',['Завершення роботи або вихід',inactive,1],['Робочий стіл',()=>{wins.forEach(x=>x.node.classList.add('min'));renderTaskbar();}]];
  items.forEach(it=>{if(it==='-'){m.appendChild(el('div','msep'));return;}const r=el('div','mi',`<span>${it[0]}</span>${it[2]?'<span class="arr">›</span>':''}`);r.onclick=()=>{closeMenus();it[1]();};m.appendChild(r);});
  m.hidden=false;
}
function showCtx(x,y,items){
  closeMenus();const m=$('#ctx');m.innerHTML='';
  items.forEach(([t,fn])=>{const r=el('div','mi',t);r.onclick=()=>{closeMenus();fn();};m.appendChild(r);});
  m.hidden=false;m.style.left=Math.max(4,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(4,Math.min(y,innerHeight-m.offsetHeight-60))+'px';
}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='Escape'||e.code==='Escape')){e.preventDefault();closeMenus();openApp('taskmgr');}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#start,#winx,#ctx,#startbtn,#batfly,#trbat'))closeMenus();},true);

/* ---------- значок батареї в треї ---------- */
(function(){
  const b=$('#trbat'),B=PC.battery;
  if(!B){b.remove();return;}
  b.innerHTML=`<svg class="g" viewBox="0 0 24 24" style="width:20px;height:20px"><rect x="2.5" y="8" width="16" height="9" rx="2"/><path d="M21 11v3"/><rect x="4.5" y="10" width="${Math.max(1,12*B.level/100)}" height="5" fill="${B.level<=20?'#c42b1c':'currentColor'}" stroke="none" rx="1"/></svg>${B.charging?'⚡':''}`;
  b.onclick=()=>{
    const f=$('#batfly'),was=!f.hidden;closeMenus();if(was)return;
    f.innerHTML=`<div class="bl"><span class="bico ${B.level<=20?'low':''}" style="transform:scale(.7);transform-origin:left center;margin-right:-16px"><i style="width:calc(${B.level}% - 6px)"></i></span>${B.level}${NB}%</div><small>${B.charging?'Заряджається · до повного заряду '+B.remain:'Залишилось приблизно '+B.remain}</small><button class="btn" style="width:100%">Налаштування живлення і батареї</button>`;
    $('button',f).onclick=()=>openApp('settings',{page:'power'});
    f.hidden=false;
  };
})();

/* ---------- робочий стіл ---------- */
(function desk(){
  const box=$('#icons');
  const items=[['Цей ПК','pc',()=>openApp('explorer')],['Кошик','bin',()=>toast('Кошик у цій імітації порожній.')],
    ...PC.fs.desktop.map(([n,k])=>[n,k,()=>k==='folder'?openApp('explorer',{page:'desktop'}):toast('Цей файл в імітації не відкривається.')])];
  items.forEach(([label,icon,open])=>{
    const d=el('div','dicon',ico(icon,40)+`<span>${label}</span>`);
    tapper(d,{tap:()=>{$$('.dicon',box).forEach(x=>x.classList.remove('sel'));d.classList.add('sel');},dbl:open});
    box.appendChild(d);
  });
  $('#desktop').addEventListener('pointerdown',e=>{if(e.target.id==='icons'||e.target.id==='desktop')$$('.dicon',box).forEach(x=>x.classList.remove('sel'));});
})();

/* ---------- підказка, годинник, запуск ---------- */
$('#hintbtn').onclick=()=>modal({title:'Як користуватися імітацією',html:`
  <p style="margin-top:0">Це <b>імітація</b> робочого столу Windows 11 (${PC.who}). Числа умовні.</p>
  <ul class="hint" style="padding-left:18px;margin:0">
    <li><b>Двічі швидко торкнись</b> значка «Цей ПК» (або один раз — значка папки внизу) — відкриється <b>Провідник</b>.</li>
    <li><b>Торкнись</b> (клацни лівою кнопкою миші) кнопки Пуск (4 квадрати внизу ліворуч) або <b>довго притримай</b> її (правий клік теж працює) — відкриється меню: <b>Диспетчер завдань</b>, <b>Диспетчер пристроїв</b>, <b>Налаштування</b>, <b>Система</b>.</li>
    <li>На комп'ютері Диспетчер завдань відкривається також клавішами <b>Ctrl + Shift + Esc</b>.</li>
    <li>У Диспетчері завдань торкайся вкладок ліворуч (кнопка ☰ показує їхні назви). Щоб відсортувати таблицю, торкнись <b>заголовка стовпця</b>.</li>
    <li>У Налаштуваннях: <b>Система → Про систему</b>; <b>Система → Живлення і батарея</b> (заряд, що витрачає батарею, стан акумулятора). На ноутбуці можна також торкнутися значка батареї біля годинника.</li>
    <li>У Провіднику довго притримай диск C: — з'явиться <b>Властивості</b>.</li>
    <li>Тут нічого не можна видалити чи вимкнути: сьогодні <b>лише дивимося</b>.</li>
  </ul>`});
function clock(){const d=new Date();$('#clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');$('#cdate').textContent=[d.getDate(),d.getMonth()+1].map(x=>String(x).padStart(2,'0')).join('.')+'.'+d.getFullYear();}
clock();setInterval(clock,10000);
setInterval(()=>{tick();wins.forEach(w=>w.update&&!w.node.classList.contains('min')&&w.update());},1000);
renderTaskbar();

/* пряме відкриття через адресу: …html#taskmgr  #explorer  #devmgr  #settings  #about  #memory  #power  #winx  #start */
(function(){
  const h=location.hash.slice(1);
  if(h==='about')openApp('settings',{page:'about'});
  else if(h==='memory')openApp('settings',{page:'memory'});
  else if(h==='power'||h==='battery')openApp('settings',{page:'power'});
  else if(h==='winx')showWinX();
  else if(h==='start')toggleStart();
  else if(APPS[h])openApp(h);
})();
</script>
</body>
</html>
