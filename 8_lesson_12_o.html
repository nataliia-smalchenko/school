<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Збираю комп'ютер</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mut:#5b6478;--acc:#2f6fed;--acc2:#e8f0ff;--ok:#1b8a4b;--okbg:#e6f6ec;--bad:#c62828;--badbg:#fdeaea;--warn:#a96200;--warnbg:#fff4e0;--line:#d9deea}
@media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--ink:#e8ecf6;--mut:#9aa4bd;--acc:#6b9cff;--acc2:#222c47;--ok:#58d38b;--okbg:#17301f;--bad:#ff8a8a;--badbg:#3a1c1c;--warn:#ffc267;--warnbg:#3a2a12;--line:#2f3750}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 6px;border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--acc);transition:width .3s}
.stepname{font-size:14px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
h1{font-size:22px;margin:8px 0}
h2{font-size:19px;margin:6px 0 8px}
p{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hint{background:var(--acc2);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin:10px 0}
.hint b{display:block;margin-bottom:2px}
.warn{background:var(--warnbg);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
label.f{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 18px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:var(--acc2);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav .sum{flex:1;min-width:0;font-size:13px;line-height:1.25;cursor:pointer}
.nav .sum b{font-size:16px}
.nav .sum.over b{color:var(--bad)}
.nav .btn{flex:none}
.optw{border:2px solid var(--line);border-radius:16px;padding:12px;margin:22px 0;background:var(--card)}
.optw.sel{border-color:var(--acc);background:var(--acc2)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;padding:0;margin:0;cursor:pointer}
.opt .row{display:flex;gap:12px}
.ph{flex:none;width:84px;height:84px;border-radius:10px;background:#eef1f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.opt .nm{font-weight:700}
.opt .pr{font-weight:700;color:var(--acc);white-space:nowrap}
.opt ul{margin:4px 0 0;padding-left:18px;color:var(--mut);font-size:14px}
details.more{margin-top:4px;font-size:14px}
details.more summary{cursor:pointer;color:var(--acc);min-height:32px;display:flex;align-items:center}
.src{font-size:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.src .rg{margin-bottom:8px}
a.hl{display:block;text-align:center;min-height:44px;padding:11px 12px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;text-decoration:none}
.optw.sel a.hl{background:var(--acc)}
.sub{font-weight:700;margin:20px 0 0;font-size:17px}
.sit{border-left:6px solid var(--acc)}
.sit .big{font-size:20px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td:last-child,table.t th:last-child{text-align:right;white-space:nowrap}
.chk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk .m{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.chk.ok .m{background:var(--ok)}.chk.no .m{background:var(--bad)}
.score{font-size:40px;font-weight:800;text-align:center;margin:4px 0}
.game{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gb{display:block;width:100%;margin-bottom:8px;font:inherit;color:inherit;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px;min-height:56px;cursor:pointer}
.gtray{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtray .gb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:13px;margin:0}
.gi svg{width:56px;height:56px;background:#eef1f7;border-radius:8px}
.gb.sel{border-color:var(--acc);background:var(--acc2)}.gb.done{border-color:var(--ok);background:var(--okbg);cursor:default}.gb.err{border-color:var(--bad);background:var(--badbg)}
.small{font-size:13px;color:var(--mut)}
details.det{margin-top:8px}
details.det summary{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;list-style:none}
details.det summary::-webkit-details-marker{display:none}
details.det[open] summary{background:var(--card);color:var(--acc);border:2px solid var(--acc)}
details.det dl{margin:10px 0 0}
details.det dt{font-weight:700;margin-top:8px}
details.det dd{margin:2px 0 0;color:var(--ink)}
.center{text-align:center}
.okc{color:var(--ok);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--acc2);color:var(--acc)}

.tg text{font-size:12px}
@media (max-width:600px){
 body{font-size:17.5px}
 h1{font-size:25px}h2{font-size:22px}
 .stepname{font-size:15px}
 .opt .nm{font-size:17.5px}.opt .pr{font-size:17px}
 .opt ul{font-size:16px}
 details.more{font-size:16.5px}
 .src{font-size:16px}.small{font-size:15px}
 table.t{font-size:16px}
 .nav .sum{font-size:14.5px}.nav .sum b{font-size:17.5px}
 .btn{font-size:17px}
 .gtray .gb{font-size:15.5px}
 .chk{font-size:16.5px}
 label.f{font-size:17.5px}
 input[type=text],input[type=number],textarea{font-size:17px}
}
</style>
</head>

  ['Як читати назву чипсета','Літера показує клас. A: початковий, найменше можливостей. B: середній, оптимальне співвідношення ціни та можливостей. H: спрощений клас Intel. Z і X: для ентузіастів, із розгоном. Цифри показують серію (покоління) плат.'],
  ['A520','Найпростіший чипсет для процесорів AMD з сокетом AM4 (Ryzen 5000). Мало швидких роз\'ємів, розгону немає. Дешеві плати для офісу й навчання.'],
  ['B550','Середній чипсет для AM4. Швидший роз\'єм PCIe 4.0 для відеокарти й SSD, більше портів, можна розганяти процесор. Хороший вибір для нового ПК на AM4.'],
  ['B650','Середній чипсет для нової платформи AM5 (Ryzen 7000 і 8000). Працює лише з пам\'яттю DDR5 і підтримує швидші SSD та відеокарти.'],
  ['B760','Середній чипсет для процесорів Intel 12–14 покоління (сокет LGA1700). Є плати і з DDR4, і з DDR5, тому тип пам\'яті дивіться в описі плати. Розгін процесора на B760 не підтримується.'],
  ['Відеовиходи на платі','На материнській платі є роз\'єми для монітора (HDMI, DisplayPort, VGA, DVI), але вони працюють лише тоді, коли в процесорі є вбудована графіка. Якщо стоїть окрема відеокарта, монітор підключають до неї.'],
  ['M.2','Слот для малих швидких SSD, які встановлюють прямо на плату. На деяких платах їх 1, на інших 2.'],
  ['DDR4 / DDR5','Покоління оперативної пам\'яті. Вони різні за формою роз\'єму, тому DDR4 не встановиться в слот DDR5. Покоління визначає материнська плата.']],
 ram:[['Покоління DDR4 і DDR5','Покоління пам\'яті. Новіше (DDR5) швидше, але вимагає плату саме під нього.'],
  ['Обсяг, ГБ','Скільки даних одночасно тримає пам\'ять. 8 ГБ — мінімум, 16 ГБ — комфортно для навчання, 32 ГБ — для програмування, монтажу й 3D.'],
  ['Частота (3200, 5600, 6000)','Скільки мільйонів разів на секунду пам\'ять може передати дані (МТ/с). Більше — швидше.'],
  ['DIMM і SO-DIMM (форм-фактор)','Форм-фактор — це розмір і форма модуля. DIMM: повнорозмірна планка (≈ 13,3 см) для настільних комп\'ютерів, у слотах материнської плати. SO-DIMM: вдвічі коротша (≈ 6,9 см), для ноутбуків, міні-ПК і моноблоків. Вони мають різну довжину й розташування контактів, тому ноутбучна планка в настільну плату не встановиться. Усі модулі в цьому завданні мають форму DIMM.'],
  ['Інші форм-фактори','У нових ноутбуків трапляється пам\'ять CAMM2 (плоский модуль, який гвинтиками притискається до плати) або пам\'ять, запаяна просто на материнській платі, яку замінити не можна.'],
  ['Комплект 2×8 ГБ','Два модулі по 8 ГБ. Вони працюють у двоканальному режимі (одночасно), це швидше, ніж один модуль 16 ГБ.']],
 ssd:[['SSD і HDD','SSD — без рухомих частин, дуже швидкий і тихий. HDD — із обертовим диском, повільніший і чутливий до струсів, зате дешевший за гігабайт.'],
  ['SATA і NVMe','Два типи підключення SSD. SATA — до 500 МБ/с. NVMe (M.2) — у кілька разів швидше й ставиться у слот M.2 на платі.'],
  ['Швидкість, МБ/с','Скільки даних диск читає за секунду. Для HDD її замінюють на швидкість обертання (7200 об/хв).'],
  ['Обсяг, ГБ і ТБ','1 ТБ = 1000 ГБ. Системі й програмам вистачає 256–480 ГБ, відео й проєкти займають значно більше.']],
 gpu:[['Відеокарта і вбудована графіка','Відеокарта окремо рахує зображення, ігри й відео. Вбудована графіка робить це гірше, зате безкоштовно й економно.'],
  ['Відеопам\'ять, ГБ','Пам\'ять самої відеокарти (VRAM). Для великих 3D-сцен і важкого відео її потрібно багато (від 12 ГБ).'],
  ['GDDR6, GDDR7','Тип відеопам\'яті. Нове покоління швидше.'],
  ['Споживання, Вт','Скільки енергії бере відеокарта. Вона може споживати більше, ніж решта комп\'ютера разом.'],
  ['Виходи на монітор','Роз\'єми відеокарти для монітора: HDMI і DisplayPort. Перевірте, чи є такий самий роз\'єм у вашого монітора. Якщо відеокарта є, монітор підключають до неї, а не до материнської плати.'],
  ['Рекомендований блок живлення','Мінімальна потужність блока живлення, на яку розраховує виробник відеокарти. Менший блок брати не можна.']],
 cool:[['Баштовий кулер','Радіатор із тепловими трубками й вентилятором. Охолоджує краще за простий кулер з комплекту.'],
  ['Шум, дБ','Чим менше число, тим тихіше. Нижче 25 дБ — дуже тихо, понад 30 дБ — чутно.'],

 case:[['ATX і mATX','Формат материнської плати. Корпус ATX вміщає плати ATX і mATX, корпус mATX — лише mATX.'],

 mon:[['Діагональ, дюйми (″)','Розмір екрана по діагоналі. 1 дюйм = 2,54 см. 24″ — стандарт для навчання, 27″ — для роботи з кількома вікнами.'],
  ['Роздільність (FHD, 4K)','Кількість точок на екрані. FHD — 1920×1080, 4K — 3840×2160. Чим більше точок, тим чіткіше зображення, але й більше навантаження на відеокарту.'],
  ['Частота оновлення, Гц','Скільки разів на секунду оновлюється картинка. 60–75 Гц достатньо для навчання, 144–165 Гц — для динамічних ігор.'],
  ['Роз\'єми для підключення монітора','HDMI: найпоширеніший цифровий роз\'єм, передає і зображення, і звук. DisplayPort: цифровий, часто для високих частот оновлення й 4K. VGA: старий аналоговий роз\'єм, зображення гірше. DVI: цифровий, без звуку. USB-C: у деяких моніторах передає зображення й заряджає ноутбук. Монітор і комп\'ютер мають мати хоча б один спільний тип роз\'єму. Роз\'єми комп\'ютера дивіться у відеокарти чи на материнській платі (якщо працює вбудована графіка).'],
  ['Матриця VA і IPS','IPS точніше передає кольори й має ширші кути огляду. VA контрастніша й зазвичай дешевша.'],
  ['Роз\'єми','HDMI, DisplayPort — цифрові, VGA — старий аналоговий. Потрібно, щоб монітор і ПК мали спільний роз\'єм.'],
  ['Споживання, Вт','Монітор теж споживає енергію. Додайте її до споживання комп\'ютера.']],
 kbms:[['Дротова і бездротова','Дротова не потребує батарейок і не затримується. Бездротова (радіо 2,4 ГГц або Bluetooth) зручніша, але живиться від батареї.'],
  ['Мембранна і механічна','Мембранна — тиха й дешева. Механічна — з окремим перемикачем під кожною клавішею, довговічна, але гучніша.'],
  ['Оптична мишка','Сенсор читає рух по поверхні світлом. Більшість мишок — оптичні.'],
  ['Низькопрофільна клавіатура','Клавіатура з низькими клавішами й малим ходом (≈ 1–2 мм замість 3–4 мм) і тонким корпусом, як у ноутбука. Такі клавіші частіше тихіші, а кисть менше піднімається над столом. Спершу може бути незвично друкувати.'],
  ['Ергономіка','Зручна клавіатура й мишка зменшують втому рук під час тривалої роботи.']],
 camaud:[['Роздільність відео (720p, 1080p)','Чіткість зображення вебкамери. 720p достатньо для уроків, 1080p — чіткіше для стрімів.'],
  ['Вбудований мікрофон','Деякі вебкамери й гарнітури мають мікрофон. Для відеодзвінка потрібен мікрофон хоча б в одному пристрої.'],
  ['Гарнітура і студійні навушники','Гарнітура — навушники з мікрофоном, для спілкування. Студійні — точніше передають звук для запису й монтажу, але без мікрофона.']],
 psu:[['Потужність, Вт','Скільки енергії блок може віддати всім складовим. Має бути не меншою за споживання комп\'ютера із запасом.'],
  ['Запас 30 %','Блок працює найкраще, коли навантажений не на повну. Тому до суми споживання додають ще 30 %. Приклад: 200 Вт × 1,3 = 260 Вт.'],
  ['80 PLUS','Сертифікат ККД блока. Bronze, Silver, Gold показують, яка частка енергії не втрачається на тепло. Gold ефективніший за Bronze.'],
  ['Вимога відеокарти','Виробник вказує мінімальну потужність БЖ. Блок слабший за цю цифру брати не можна, навіть якщо сума Вт менша.']]

const TITLE={cpu:'Процесор',mb:'Материнська плата',ram:'Оперативна пам\'ять',ssd:'Накопичувач',gpu:'Відеокарта',cool:'Охолодження процесора',psu:'Блок живлення',case:'Корпус',mon:'Монітор',kb:'Клавіатура',ms:'Мишка',cam:'Вебкамера',aud:'Навушники або гарнітура'};
let S=load()||fresh();
if(!S.cid)S.cid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():('c'+Date.now()+Math.random().toString(16).slice(2));
function fresh(){return{v:1,step:0,name:'',surname:'',sit:null,sel:{},w:'',hours:'',q1:'',first:null,game:{pairs:0,done:false},gdone:[],gerr:0,started:Date.now(),log:{leaves:[],copies:0,srcs:[],stepSec:{}},sent:false,finalR:null,orders:{}};}
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const sit=()=>SIT.find(x=>x.id===S.sit);
const iGame=()=>STEPS.findIndex(x=>x.id==='game');
function build(){const b={};for(const k of Object.keys(CAT)){const id=S.sel[k];const it=id&&CAT[k].find(x=>x.id===id);if(!it)return null;b[k]=it;}return b;}
function partial(){let s=0,w=BASE_W;for(const k of Object.keys(S.sel)){const it=CAT[k].find(x=>x.id===S.sel[k]);if(it){s+=it.price||0;w+=(it.w||0);}}return{sum:s,w:w};}
function rng(it){const d=it.status==='пошук'?.10:.15;return[Math.round(it.price*(1-d)/50)*50,Math.round(it.price*(1+d)/50)*50];}
function shuffled(cat){if(!S.orders[cat]){const a=CAT[cat].map(x=>x.id);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}S.orders[cat]=a;}return S.orders[cat].map(id=>CAT[cat].find(x=>x.id===id));}

/* ============ ЖУРНАЛ ВИХОДІВ ============ */
let stepStart=Date.now(), leaveAt=null, lastSrc=0;
const nowRel=()=>Math.round((Date.now()-S.started)/1000);
function leaveBegin(){if(leaveAt!==null||S.step===0||S.step>=iGame())return;leaveAt=Date.now();}
function leaveEnd(){if(leaveAt===null)return;const d=Math.round((Date.now()-leaveAt)/1000);const kind=(leaveAt-lastSrc<2500)?'source':'tab';if(d>=1)S.log.leaves.push({t:Math.round((leaveAt-S.started)/1000),d:d,kind:kind,step:STEPS[S.step].id});leaveAt=null;save();}
document.addEventListener('visibilitychange',()=>{document.hidden?leaveBegin():leaveEnd();});
window.addEventListener('blur',leaveBegin);
window.addEventListener('focus',()=>{if(!document.hidden)leaveEnd();});
['copy','cut','paste'].forEach(ev=>document.addEventListener(ev,()=>{S.log.copies++;save();}));
document.addEventListener('click',e=>{const a=e.target.closest('a[data-src]');if(a){lastSrc=Date.now();S.log.srcs.push({id:a.dataset.src,t:nowRel()});save();}});
function stepTime(){const id=STEPS[S.step].id;S.log.stepSec[id]=(S.log.stepSec[id]||0)+Math.round((Date.now()-stepStart)/1000);stepStart=Date.now();}

/* ============ ЕКРАНИ ============ */
function render(){
 const st=STEPS[S.step], app=$('#app');
 $('#stn').textContent=st.n;
 const nq=STEPS.findIndex(x=>x.id==='q');
 $('#stc').textContent=S.step>=1&&S.step<=nq?'Крок '+S.step+' з '+nq:'';
 $('#pg').style.width=Math.round(S.step/(STEPS.length-1)*100)+'%';
 updSum();
 $('#bBack').style.visibility=(S.step===0||S.step>=iGame())?'hidden':'visible';
 app.replaceChildren();
 window['view_'+st.id](app);
 updNext();window.scrollTo(0,0);
}
function updSum(){
 const si=sit(),p=partial(),sc=$('#sum');
 if(si&&S.step>=1&&S.step<iGame()){const over=p.sum>si.budget;sc.className='sum'+(over?' over':'');setH(sc,'<b>'+fmt(p.sum)+' / '+fmt(si.budget)+' грн</b><br>≈ '+Math.round(p.w)+' Вт');}
 else{sc.className='sum';sc.replaceChildren();}
}
function updNext(){
 const st=STEPS[S.step], b=$('#bNext');let ok=true,label='Далі';
 if(st.id==='name')ok=S.name.trim().length>1&&S.surname.trim().length>1;
 else if(st.id==='psu')ok=!!S.sel.psu&&Number(S.w)>0;
 else if(st.cats)ok=st.cats.every(c=>S.sel[c]);
 else if(st.id==='q')ok=S.q1.trim().length>=20&&Number(S.hours)>0;
 else if(st.id==='game')label='Надіслати результат';
 else if(st.id==='end'){b.style.display='none';return;}
 if(st.id==='check')label='До висновків';
 if(st.id==='sit')label='Починаємо';
 b.style.display='';b.textContent=label;b.disabled=!ok;
}
window.view_name=function(a){
 setH(a,'<h1>Збираю комп\'ютер</h1><p>Ви самі оберете складові комп\'ютера для однієї з життєвих ситуацій. Усе потрібне є на цій сторінці. На завдання — до 20 хвилин.</p>'+
 '<div class="card"><label class="f" for="sn">Прізвище</label><input type="text" id="sn" autocomplete="family-name" value="'+esc(S.surname)+'"><label class="f" for="nm">Ім\'я</label><input type="text" id="nm" autocomplete="given-name" value="'+esc(S.name)+'"></div>'+
 '<div class="warn">Сторінка записує, скільки разів ви виходили з неї і на скільки, а також час на кожен крок. Працюйте лише тут. Посилання на ціни й характеристики можна відкривати: це враховується окремо.</div>');
 $('#sn').oninput=e=>{S.surname=e.target.value;save();updNext();};
 $('#nm').oninput=e=>{S.name=e.target.value;save();updNext();};
};
window.view_sit=function(a){
 if(!S.sit){S.sit=SIT[Math.floor(Math.random()*SIT.length)].id;save();updSum();}
 const s=sit();
 setH(a,'<h2>Ваша ситуація</h2><div class="card sit"><div class="big">'+esc(s.name)+'</div><p>'+esc(s.text)+'</p><p><b>Бюджет: '+fmt(s.budget)+' грн.</b></p></div>'+
 '<div class="hint"><b>Що треба зробити</b>Складіть комп\'ютер так, щоб він підходив цій людині, усі складові були сумісні, а сума не перевищувала бюджет. Внизу завжди видно, скільки вже витрачено.</div>'+
 '<p class="small">Ціни орієнтовні, станом на '+PRICE_DATE+'. Біля кожної складової є кнопка для перевірки ціни на Hotline.</p>');
};

 const K='#445',G='#2e7d4f',Y='#d4a017',L='#cfd4dc';
 const fan=(x,y,r)=>'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#222" stroke="#aab" stroke-width="1.5"/><path d="M'+x+' '+y+'l'+r*.7+' -'+r*.4+'M'+x+' '+y+'l-'+r*.7+' -'+r*.4+'M'+x+' '+y+'l0 '+r*.8+'" stroke="#9ab" stroke-width="2.5" stroke-linecap="round"/>';
 const none='<rect x="12" y="20" width="56" height="40" rx="6" fill="none" stroke="#99a" stroke-width="2" stroke-dasharray="5 4"/><path d="M28 32l24 16M52 32L28 48" stroke="#99a" stroke-width="3" stroke-linecap="round"/>';

async function post(r){
 if(!SUPABASE.url)throw new Error('no-db');
 const res=await fetch(SUPABASE.url+'/rest/v1/results',{method:'POST',headers:dbHeaders(),body:JSON.stringify(r)});
 if(!res.ok)throw new Error('http '+res.status);
}
// Надсилає запис; якщо не вдалося, зберігає в браузері лише останній (його надішле таймер)
async function saveRecord(r){
 try{await post(r);try{localStorage.removeItem(QKEY);}catch(_){}if(r.payload.status==='final'){S.sent=true;save();}return true;}
 catch(e){try{localStorage.setItem(QKEY,JSON.stringify([r]));}catch(_){}return false;}
}
// Чернетка: проміжний результат (зберігається в базі, щоб не втратити роботу)
let draftT=null;
function saveDraft(){
 if(S.sent||!SUPABASE.url||!build()||!S.sit)return;
 clearTimeout(draftT);
 draftT=setTimeout(()=>{if(S.sent)return;try{saveRecord(resultObj('draft'));}catch(_){}},600);
}
async function send(){
 const el=$('#sendst');if(!el)return;
 const r=S.finalR;
 if(S.sent){setH(el,'<b>Результат надіслано ✓</b>');return;}
 const ok=await saveRecord(r);
 if(ok)setH(el,'<b>Результат надіслано ✓</b>');
 else setH(el,SUPABASE.url?'<b>Не вдалося надіслати.</b> Результат збережено в браузері й надішлеться, коли з\'явиться зв\'язок. Не закривайте сторінку.':'<b>Базу не підключено.</b> Натисніть «Зберегти файл результату» й надішліть файл учительці.');
}
setInterval(async()=>{if(!SUPABASE.url)return;let q=[];try{q=JSON.parse(localStorage.getItem(QKEY)||'[]');}catch(_){}if(!q.length)return;try{await post(q[0]);localStorage.removeItem(QKEY);if(q[0].payload.status==='final'){S.sent=true;save();const el=$('#sendst');if(el)setH(el,'<b>Результат надіслано ✓</b>');}}catch(e){}},20000);
// якщо учень залишає сторінку після перевірки, зберігаємо чернетку
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.step>=STEPS.findIndex(x=>x.id==='check')&&S.step<iGame()+1)saveDraft();});
/* ============ НАВІГАЦІЯ ============ */
$('#bNext').onclick=()=>{
 stepTime();
 if(STEPS[S.step].id==='q')saveDraft();
 if(S.step===0){S.name=S.name.trim();S.surname=S.surname.trim();}
 S.step=Math.min(S.step+1,STEPS.length-1);
 save();render();
};
$('#bBack').onclick=()=>{stepTime();S.step=Math.max(0,S.step-1);save();render();};
$('#sum').onclick=()=>{const p=partial();const si=sit();if(!si)return;const lines=Object.keys(S.sel).map(k=>{const it=CAT[k].find(x=>x.id===S.sel[k]);return TITLE[k]+': '+it.name+' — '+(it.price?fmt(it.price)+' грн':'0');});alert((lines.join('\n')||'Ще нічого не обрано')+'\n\nРазом: '+fmt(p.sum)+' грн; бюджет '+fmt(si.budget)+' грн');};
render();
</script>
</body>
</html>
